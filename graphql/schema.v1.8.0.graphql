"Order in which to sort query results"
enum Direction {
  "Ascending order" ASC
  "Descending order" DESC
}

"How one recorded execution attempt ended"
enum DistributionJobAttemptResult {
  "The worker reported success" SUCCEEDED
  "The worker reported a failure" FAILED
  "A cancellation closed the attempt" CANCELLED
  "The lease expired with no worker response" ABANDONED
}

"Why a distribution job was cancelled"
enum DistributionJobCancellationReason {
  "An operator cancelled the job deliberately" ADMINISTRATIVE
  "The publisher's assignment for a destination of this job was disabled" ASSIGNMENT_DISABLED
}

"Kind of durable distribution work a job represents"
enum DistributionJobKind {
  "Onboarding of a publisher's existing back catalogue to newly activated destinations" PUBLISHER_BACK_CATALOGUE
}

"Lifecycle state of one durable distribution job"
enum DistributionJobStatus {
  "Durable work exists and is not claimed" PENDING
  "Claimed by one worker under a live or expired lease" RUNNING
