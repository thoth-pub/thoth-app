schema {
  query: QueryRoot
  mutation: MutationRoot
}

"Field to use when sorting abstract list"
enum AbstractField {
  ABSTRACT_ID
  WORK_ID
  CONTENT
  LOCALE_CODE
  ABSTRACT_TYPE
  CANONICAL
}

"BCP-47 code representing locale"
enum AbstractType {
  "Short" SHORT
  "Long" LONG
}

"Reason for publication not being required to comply with accessibility standards"
enum AccessibilityException {
  "Publisher is a micro-enterprise" MICRO_ENTERPRISES
  "Making the publication accessible would financially overburden the publisher" DISPROPORTIONATE_BURDEN
  "Making the publication accessible would fundamentally modify the nature of it" FUNDAMENTAL_ALTERATION
}

"Standardised specification for accessibility to which a publication may conform"
enum AccessibilityStandard {
  "WCAG 2.1 AA" WCAG21AA
  "WCAG 2.1 AAA" WCAG21AAA
  "WCAG 2.2 AA" WCAG22AA
  "WCAG 2.2 AAA" WCAG22AAA
  "EPUB Accessibility Specification 1.0 AA" EPUB_A11Y10AA
  "EPUB Accessibility Specification 1.0 AAA" EPUB_A11Y10AAA
  "EPUB Accessibility Specification 1.1 AA" EPUB_A11Y11AA
  "EPUB Accessibility Specification 1.1 AAA" EPUB_A11Y11AAA
  "PDF/UA-1" PDF_UA1
  "PDF/UA-2" PDF_UA2
}

