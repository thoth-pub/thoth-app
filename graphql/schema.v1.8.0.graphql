  "The work is in progress and is expected to be published. This is the typical status for a work that has not yet been released but is planned for publication." FORTHCOMING
  "The work is published and currently available. This status indicates that the work is officially released." ACTIVE
  "The work has been withdrawn from publication and will be removed from all distribution channels. This status indicates that the work is no longer available for sale or distribution and will no longer be accessible." WITHDRAWN
  "The work has been replaced by a new edition, with the previous edition now considered outdated. The two editions should be linked using a `WorkRelation` of type `REPLACES`/`IS_REPLACED_BY`." SUPERSEDED
  "The work's release has been delayed indefinitely. It may be resumed at a later time, but currently, no publication date is set." POSTPONED_INDEFINITELY
  "The work has been permanently cancelled and will not be published." CANCELLED
}

